<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Airfinder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" class="auth-logo-text">✈ Airfinder</a>
    </div>
    <h2 class="auth-title">Set new password</h2>
    <p class="auth-sub">Choose a strong password for your account.</p>
    <div id="alert"></div>
    <form id="reset-form">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="password-toggle">
          <input class="form-control" id="password" type="password" placeholder="Min 8 characters" required>
          <button type="button" class="toggle-btn" id="toggle-pw"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input class="form-control" id="confirm" type="password" placeholder="Repeat password" required>
      </div>
      <button class="btn btn-primary btn-full" type="submit" id="submit-btn">Reset Password</button>
    </form>
    <div class="auth-footer mt-2"><a href="/auth/login.html">← Back to login</a></div>
  </div>
</div>
<script src="/js/csp-actions.js"></script>
<script src="/js/api.js"></script>
<script src="/js/pages/auth-reset-password.js"></script>
</body>
</html>
