<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Airfinder Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="force-change-wrapper">
  <div class="force-change-card">
    <div class="force-change-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h2 style="text-align:center;margin-bottom:8px;">Change Your Password</h2>
    <p class="text-gray text-sm text-center mb-3">You are using a temporary password. You must set a new password before continuing.</p>

    <div class="alert alert-warning"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> This is required on first login and cannot be skipped.</div>
    <div id="alert"></div>

    <form id="change-pw-form">
      <div class="form-group">
        <label class="form-label">Current (Temporary) Password</label>
        <div class="password-toggle">
          <input class="form-control" id="current_password" type="password" required placeholder="Your temporary password">
          <button type="button" class="toggle-btn" data-click="togglePw" data-args='["current_password"]'><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="password-toggle">
          <input class="form-control" id="new_password" type="password" required placeholder="Min 8 characters">
          <button type="button" class="toggle-btn" data-click="togglePw" data-args='["new_password"]'><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="strength-bar mt-1"><div class="strength-fill" id="strength-fill" style="width:0;background:var(--red);"></div></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input class="form-control" id="confirm_password" type="password" required placeholder="Repeat new password">
      </div>
      <button class="btn btn-primary btn-full mt-2" type="submit" id="submit-btn">Set New Password</button>
    </form>
  </div>
</div>
<script src="/js/csp-actions.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/pages/admin-change-password.js"></script>
</body>
</html>
